[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ai"
version = "0.1.0"
description = "Local-first ethical AI prototype"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
aegis = "aegis.cli.main:main"

[tool.setuptools]
packages = [
    "aegis",
    "aegis.cli",
    "aegis.memory",
    "aegis.provider",
    "aegis.permissions",
    "aegis.tools",
]
